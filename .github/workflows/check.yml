name: Rebuild the verifier

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Rebuild the page and compare it byte for byte
        run: bun run check
      - name: Check the pinned SHA-256
        run: sha256sum -c checksums.txt
